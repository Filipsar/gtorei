<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Endurecimento que funciona em qualquer host, sem depender de header do servidor.
         Sem default-src/script-src de propósito: quebraria Supabase, fontes e o script
         de tema inline. frame-ancestors só vale em header — está no vercel.json e no _headers. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests"
    />

    <title>GTORei — Treinador de Poker GTO grátis em português</title>
    <meta
      name="description"
      content="Treine decisões de poker GTO de graça: ranges pré-flop por posição e stack, push/fold calculado por EV, análise de mãos por IA e ranking. Em português."
    />
    <meta name="author" content="GTORei" />

    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1a1a1a" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fafafa" />

    <!-- O app só fala com o Supabase; abrir a conexão cedo economiza um round-trip no login -->
    <link rel="preconnect" href="https://dejfimivoonbmgfxtbdf.supabase.co" crossorigin />
    <link rel="dns-prefetch" href="https://dejfimivoonbmgfxtbdf.supabase.co" />

    <!-- Aplica o tema salvo antes da página desenhar, para não piscar escuro->claro -->
    <script>
      (function () {
        function apply() {
          var theme = 'dark';
          try { theme = localStorage.getItem('gtorei_theme') || 'dark'; } catch (e) {}
          var prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
          var isLight = theme === 'light' || (theme === 'system' && prefersLight);
          var root = document.documentElement;
          root.classList.remove('light', 'dark');
          root.classList.add(isLight ? 'light' : 'dark');
        }
        apply();
        if (window.matchMedia) {
          var mq = window.matchMedia('(prefers-color-scheme: light)');
          var onChange = function () {
            var theme = 'dark';
            try { theme = localStorage.getItem('gtorei_theme') || 'dark'; } catch (e) {}
            if (theme === 'system') apply();
          };
          if (mq.addEventListener) mq.addEventListener('change', onChange);
          else if (mq.addListener) mq.addListener(onChange);
        }
      })();
    </script>

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GTORei" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:url" content="https://www.gtorei.com.br/" />
    <meta property="og:title" content="GTORei — Treinador de Poker GTO grátis em português" />
    <meta
      property="og:description"
      content="Ranges pré-flop por posição e stack, push/fold calculado por EV e análise de mãos por IA. De graça, em português."
    />
    <!-- PNG no domínio próprio: o WhatsApp, que é por onde o link mais circula aqui, não renderiza WebP -->
    <meta property="og:image" content="https://www.gtorei.com.br/og-gtorei.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="GTORei — treinador de poker GTO gratuito em português" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="GTORei — Treinador de Poker GTO grátis em português" />
    <meta
      name="twitter:description"
      content="Ranges pré-flop por posição e stack, push/fold calculado por EV e análise de mãos por IA. De graça, em português."
    />
    <meta name="twitter:image" content="https://www.gtorei.com.br/og-gtorei.png" />

    <script type="application/ld+json">
      {"@context":"https://schema.org","@type":"Organization","name":"GTORei","url":"https://www.gtorei.com.br","logo":"https://www.gtorei.com.br/icon-192.png","sameAs":["https://www.instagram.com/gtorei"]}
    </script>
    <script type="application/ld+json">
      {"@context":"https://schema.org","@type":"WebSite","name":"GTORei","url":"https://www.gtorei.com.br","inLanguage":"pt-BR"}
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
