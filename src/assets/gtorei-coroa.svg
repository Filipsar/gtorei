<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="GTORei">
  <!--
    Coroa do GTORei — "Alta v2", aprovada em 29/09/2026.

    Proporções que importam, caso alguém vá mexer:
    · dente central 50 unidades contra 32 dos externos (1,56). Acima de ~1,7 a
      silhueta vira espeto e passa a ler como gráfico, não como coroa.
    · os dentes afundam 8 unidades dentro da faixa: é o que faz a coroa ser uma
      massa contínua. Barra solta em cima de barra lê como equalizador.
    · a joia fica em cy 71, e não no centro geométrico da faixa (72): um pouco
      acima é onde o olho a vê centrada.

    Cor por currentColor, então basta definir `color` no elemento pai.
  -->
  <mask id="joia">
    <rect width="100" height="100" fill="#fff"/>
    <circle cx="50" cy="71" r="5.4" fill="#000"/>
  </mask>
  <g mask="url(#joia)" fill="currentColor">
    <rect x="14"    y="38" width="10.5" height="32" rx="4.2"/>
    <rect x="29.4"  y="30" width="10.5" height="40" rx="4.2"/>
    <rect x="44.75" y="20" width="10.5" height="50" rx="4.2"/>
    <rect x="60.1"  y="30" width="10.5" height="40" rx="4.2"/>
    <rect x="75.5"  y="38" width="10.5" height="32" rx="4.2"/>
    <rect x="14"    y="62" width="72"   height="20" rx="7.5"/>
  </g>
</svg>
